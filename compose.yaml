services:
  nginx:
    image: docker.io/library/nginx:stable-alpine
    container_name: nginx-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    # ,z relabels for SELinux (no-op on hosts without it)
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro,z
      - ./nginx/snippets:/etc/nginx/snippets:ro,z
      - ./logs:/var/log/nginx:z
    # podman injects host.containers.internal by itself; this adds the docker
    # spelling too so either name works in an upstream config
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # Upstream containers join this too, so they can be reached by container
    # name without publishing a host port. Create it once:
    #   podman network create mcp-net
    networks:
      - mcp-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3

networks:
  mcp-net:
    external: true
