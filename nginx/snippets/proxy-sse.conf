# proxy.conf with long timeouts, for SSE / streaming upstreams (MCP servers,
# log tails, event streams). nginx has no way to override a directive already
# set by an include, so this is a full alternative to proxy.conf rather than a
# supplement - include one or the other, never both. Keep the header block in
# sync with proxy.conf.

proxy_http_version 1.1;

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    24h;
proxy_read_timeout    24h;

proxy_buffering off;
proxy_request_buffering off;
proxy_cache off;
client_max_body_size 100m;
