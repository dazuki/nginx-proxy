# Drop-in for the standalone nginx-proxy stack.
# Copy to its nginx/conf.d/locations/tokencounter.conf and run ./reload.sh.
#
# Reached over the shared `mcp-net` podman network by container name, so this
# MCP publishes no host port. The trailing slash on proxy_pass strips the
# prefix: /tokencounter/mcp arrives upstream as /mcp, which is MCP_PATH.
#
# proxy-sse.conf, not proxy.conf: MCP streamable HTTP is SSE and the standard
# snippet's 60s read timeout would cut a long-lived stream.

location = /tokencounter {
    return 308 /tokencounter/;
}

location /tokencounter/ {
    include /etc/nginx/snippets/proxy-sse.conf;
    proxy_pass http://tokencounter-mcp:3000/;
}
