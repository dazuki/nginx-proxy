map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP Port 80
server {
    listen 80 default_server;
    server_name _;

    absolute_redirect off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# HTTPS Port 443
server {
    listen 443 ssl default_server;
    server_name _;

    absolute_redirect off;

    ssl_certificate     /etc/nginx/ssl/172.18.0.42+1.pem;
    ssl_certificate_key /etc/nginx/ssl/172.18.0.42+1-key.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    include /etc/nginx/conf.d/locations/*.conf;

    location / {
        return 444;
    }
}