# Shared defaults. Loaded first (alphabetical); do not add proxies here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;

    absolute_redirect off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Path-prefix proxies for services reached by bare IP, one file each.
    include /etc/nginx/conf.d/locations/*.conf;

    location / {
        return 444;
    }
}
