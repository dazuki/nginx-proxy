# Shared defaults. Loaded first (alphabetical); do not add proxies here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Catch-all: anything not matching a server_name below gets dropped.
server {
    listen 80 default_server;
    server_name _;

    # Relative Location headers: an absolute one is rebuilt from $host, which
    # drops the port and breaks redirects when the proxy is reached on a
    # non-80 published port.
    absolute_redirect off;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # Path-prefix proxies for services reached by bare IP, one file each.
    # A location cannot live in its own server block, so they are included
    # here instead of dropped straight into conf.d.
    include /etc/nginx/conf.d/locations/*.conf;

    # must be a location, not a server-level return: the latter runs in the
    # rewrite phase and would swallow /healthz too
    location / {
        return 444;
    }
}
