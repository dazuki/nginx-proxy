# Shared defaults. Loaded first (alphabetical); do not add proxies here.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Catch-all: anything not matching a server_name below gets dropped.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }

    # must be a location, not a server-level return: the latter runs in the
    # rewrite phase and would swallow /healthz too
    location / {
        return 444;
    }
}
